groups:
  - name: bis-gateway-control-plane
    rules:
      - alert: BISGatewayDependencyUnavailable
        expr: bis_gateway_control_plane_dependency_healthy == 0
        for: 2m
        labels:
          severity: critical
          service: gateway
        annotations:
          summary: "BIS gateway control-plane dependency is unavailable"
          description: "{{ $labels.dependency }} has been unavailable for at least two minutes. Gateway operations depending on it must remain fail closed. Check service DNS, credential rotation, TLS, and readiness before clearing."
          runbook: "docs/operations/GATEWAY_AND_PARQUET_ARCHIVE_RUNBOOK.md#fail-closed-dependency-incident"
      - alert: BISPermifyAuthorizationErrors
        expr: sum(rate(bis_gateway_permify_checks_total{outcome="error"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
          service: gateway
        annotations:
          summary: "BIS gateway is denying requests after Permify errors"
          description: "Permission checks are failing closed because Permify responses or transport are invalid. Investigate before users experience sustained authorization denials."
      - alert: BISPermifyDenyRateSpike
        expr: sum(rate(bis_gateway_permify_checks_total{outcome="denied"}[10m])) / clamp_min(sum(rate(bis_gateway_permify_checks_total[10m])), 1) > 0.25
        for: 10m
        labels:
          severity: warning
          service: gateway
        annotations:
          summary: "BIS gateway permission denial rate exceeds 25%"
          description: "Review policy deployment, tenant bindings, and clients. This alert does not imply that the gateway has granted access."
      - alert: BISOutboxKeyRotationDue
        expr: bis_gateway_transactional_outbox_key_rotation_due == 1
        for: 5m
        labels:
          severity: critical
          service: gateway
        annotations:
          summary: "BIS transactional-outbox encryption key rotation is due"
          description: "The active outbox AES-256-GCM key is within its 30-day rotation lead window or has been replaced. Activate a new versioned key in the secret manager, retain the previous key only through the approved recovery window, and verify the dispatcher rewrites pending events before retirement."
          runbook: "docs/operations/GATEWAY_AND_PARQUET_ARCHIVE_RUNBOOK.md#transactional-outbox-key-rotation"
      - alert: BISOutboxBacklogGrowing
        expr: bis_gateway_transactional_outbox_pending_events > 100
        for: 10m
        labels:
          severity: critical
          service: gateway
        annotations:
          summary: "BIS transactional outbox has more than 100 pending events"
          description: "Kafka delivery is degraded or blocked. Events remain durable in PostgreSQL but must be drained before latency SLOs are breached."
          runbook: "docs/operations/GATEWAY_AND_PARQUET_ARCHIVE_RUNBOOK.md#transactional-outbox-incident"
      - alert: BISOutboxDeadLettered
        expr: increase(bis_gateway_transactional_outbox_events_total{state="dead_letter"}[15m]) > 0
        for: 0m
        labels:
          severity: critical
          service: gateway
        annotations:
          summary: "BIS gateway event reached transactional outbox dead-letter state"
          description: "A durable business event exhausted delivery attempts. Reconcile the row and restore Kafka before manual replay."
      - alert: BISOutboxPersistenceError
        expr: increase(bis_gateway_transactional_outbox_events_total{state="persistence_error"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
          service: gateway
        annotations:
          summary: "BIS gateway could not durably persist an event"
          description: "The gateway must reject dependent business operations. Restore PostgreSQL outbox health before retrying clients."
  - name: bis-cold-archive
    rules:
      - alert: BISColdArchiveFailure
        expr: increase(bis_cold_archive_runs_total{outcome="failed"}[26h]) > 0
        for: 0m
        labels:
          severity: critical
          service: cold-archive-writer
        annotations:
          summary: "BIS Parquet cold-archive job failed"
          description: "The scheduled archive worker returned an error in the last 26 hours. Check batch state, object storage, PostgreSQL, and Pushgateway connectivity."
          runbook: "docs/operations/GATEWAY_AND_PARQUET_ARCHIVE_RUNBOOK.md#cold-archive-incident"
      - alert: BISColdArchiveStale
        expr: time() - bis_cold_archive_last_success_timestamp_seconds > 93600
        for: 30m
        labels:
          severity: warning
          service: cold-archive-writer
        annotations:
          summary: "BIS cold archive has not exported metrics in more than 26 hours"
          description: "The scheduled job may not be running or cannot reach the Pushgateway. Confirm CronJob schedule and monitoring transport."
      - alert: BISColdArchiveSlow
        expr: histogram_quantile(0.95, sum(rate(bis_cold_archive_run_duration_seconds_bucket[7d])) by (le)) > 1200
        for: 1h
        labels:
          severity: warning
          service: cold-archive-writer
        annotations:
          summary: "BIS cold-archive p95 duration exceeds 20 minutes"
          description: "Review PostgreSQL selection query, object storage throughput, batch size, and worker resource limits before the job overlaps its next schedule."
