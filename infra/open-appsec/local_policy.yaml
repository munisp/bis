apiVersion: v1beta2

policies:
  default:
    mode: prevent-learn
    threatPreventionPractices: [bis-default-threat-prevention]
    accessControlPractices: [bis-api-rate-limits]
    triggers: [bis-security-log]
    customResponse: bis-security-block
  specificRules:
    - host: "*/api/auth/*"
      mode: prevent-learn
      threatPreventionPractices: [bis-auth-threat-prevention]
      accessControlPractices: [bis-auth-rate-limits]
      triggers: [bis-security-log]
      customResponse: bis-security-block
    - host: "*/v1/admin/*"
      mode: prevent-learn
      threatPreventionPractices: [bis-privileged-threat-prevention]
      accessControlPractices: [bis-privileged-rate-limits]
      triggers: [bis-security-log]
      customResponse: bis-security-block
    - host: "*/api/v1/*"
      mode: prevent-learn
      threatPreventionPractices: [bis-api-threat-prevention]
      accessControlPractices: [bis-api-rate-limits]
      triggers: [bis-security-log]
      customResponse: bis-security-block

threatPreventionPractices:
  - name: bis-default-threat-prevention
    practiceMode: inherited
    webAttacks:
      overrideMode: inherited
      minimumConfidence: high
      maxUrlSizeBytes: 16384
      maxHeaderSizeBytes: 32768
      maxBodySizeKb: 1024
      maxObjectDepth: 32
      protections:
        csrfProtection: prevent
        errorDisclosure: prevent
        openRedirect: prevent
        nonValidHttpMethods: true
  - name: bis-auth-threat-prevention
    practiceMode: inherited
    webAttacks:
      overrideMode: inherited
      minimumConfidence: medium
      maxUrlSizeBytes: 4096
      maxHeaderSizeBytes: 16384
      maxBodySizeKb: 64
      maxObjectDepth: 10
      protections:
        csrfProtection: prevent
        errorDisclosure: prevent
        openRedirect: prevent
        nonValidHttpMethods: true
  - name: bis-privileged-threat-prevention
    practiceMode: inherited
    webAttacks:
      overrideMode: inherited
      minimumConfidence: high
      maxUrlSizeBytes: 8192
      maxHeaderSizeBytes: 16384
      maxBodySizeKb: 256
      maxObjectDepth: 20
      protections:
        csrfProtection: prevent
        errorDisclosure: prevent
        openRedirect: prevent
        nonValidHttpMethods: true
  - name: bis-api-threat-prevention
    practiceMode: inherited
    webAttacks:
      overrideMode: inherited
      minimumConfidence: high
      maxUrlSizeBytes: 16384
      maxHeaderSizeBytes: 32768
      maxBodySizeKb: 512
      maxObjectDepth: 30
      protections:
        csrfProtection: prevent
        errorDisclosure: prevent
        openRedirect: prevent
        nonValidHttpMethods: true

accessControlPractices:
  - name: bis-api-rate-limits
    practiceMode: inherited
    rateLimit:
      overrideMode: inherited
      rules:
        - uri: "/api/v1/*"
          limit: 60
          unit: minute
          action: prevent
          comment: "Protect provider-facing APIs from volumetric and automated abuse"
        - uri: "/api/trpc/*"
          limit: 240
          unit: minute
          action: prevent
          comment: "Secondary per-source guard behind Caddy and APISIX limits"
  - name: bis-auth-rate-limits
    practiceMode: inherited
    rateLimit:
      overrideMode: inherited
      rules:
        - uri: "/api/auth/*"
          limit: 8
          unit: minute
          action: prevent
          comment: "Brute-force and credential-stuffing resistance"
  - name: bis-privileged-rate-limits
    practiceMode: inherited
    rateLimit:
      overrideMode: inherited
      rules:
        - uri: "/v1/admin/*"
          limit: 5
          unit: minute
          action: prevent
          comment: "Restrict privileged administrative automation and blast radius"

customResponses:
  - name: bis-security-block
    mode: response-code-only
    httpResponseCode: 403

logTriggers:
  - name: bis-security-log
    accessControlLogging:
      allowEvents: false
      dropEvents: true
    appsecLogging:
      detectEvents: true
      preventEvents: true
      allWebRequests: false
    extendedLogging:
      urlPath: true
      urlQuery: false
      httpHeaders: false
      requestBody: false
    additionalSuspiciousEventsLogging:
      enabled: true
      minSeverity: high
      responseBody: false
      responseCode: true
    logDestination:
      cloud: false
      logToAgent: true
      stdout:
        format: json
