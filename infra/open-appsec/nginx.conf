## ─── nginx.conf for open-appsec WAF (BIS Platform) ──────────────────────────
## Updated traffic flow (with Caddy edge layer):
##   Internet → Caddy (443) → open-appsec:8080 → APISIX:9080 → BIS Services
##
## Caddy handles:
##   - TLS termination (Let's Encrypt / internal PKI)
##   - Keycloak OIDC forward-auth (JWT validation at edge)
##   - Distributed rate limiting (Redis-backed)
##   - HTTP/3 + QUIC
##   - WAF bypass prevention (X-BIS-Edge-Token)
##
## open-appsec handles:
##   - Deep packet inspection (ML-based WAF)
##   - Bot detection and anti-automation
##   - OWASP Top-10 protection
##   - Verifies X-BIS-Edge-Token to ensure traffic came through Caddy

worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # ─── Basic Settings ───────────────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time" '
                    'edge_token="$http_x_bis_edge_token" '
                    'trace_id="$http_x_bis_trace_id"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # ─── Real IP from Caddy upstream ─────────────────────────────────────────
    # Caddy is the trusted upstream — trust its X-Forwarded-For header
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # ─── Gzip Compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    # ─── Rate Limiting Zones ──────────────────────────────────────────────────
    # NOTE: Primary rate limiting is now handled by Caddy (Redis-backed, distributed).
    # These zones are a secondary defense layer for requests that somehow bypass Caddy.
    limit_req_zone $binary_remote_addr zone=global:10m rate=500r/m;
    limit_req_zone $binary_remote_addr zone=auth:1m rate=50r/m;
    limit_req_zone $binary_remote_addr zone=lex_submit:1m rate=20r/m;
    limit_req_status 429;

    # ─── open-appsec Module ───────────────────────────────────────────────────
    # The open-appsec nginx module is loaded via the Docker image
    # open-appsec/open-appsec-nginx:latest which pre-loads the module.
    # Policy is loaded from /etc/cp/conf/open-appsec.yaml

    # ─── Upstream: APISIX Gateway ─────────────────────────────────────────────
    upstream apisix_backend {
        server apisix:9080 max_fails=3 fail_timeout=30s;
        keepalive 64;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    # ─── Map: Caddy Edge Token Validation ────────────────────────────────────
    # Validates that the request came through Caddy (WAF bypass prevention).
    # The BIS_EDGE_TOKEN_SECRET env var must match what Caddy injects.
    map $http_x_bis_edge_token $edge_token_valid {
        default                                              0;
        "${BIS_EDGE_TOKEN_SECRET}"                           1;
    }

    # ─── Main Server Block (port 8080 — behind Caddy) ────────────────────────
    server {
        # Listen on 8080 — Caddy connects to this port
        # Port 80/443 are now owned by Caddy
        listen 8080;
        server_name _;

        # ── Health check endpoint ────────────────────────────────────────────
        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"open-appsec-waf","layer":"waf"}';
            add_header Content-Type application/json;
        }

        # ── Caddy edge token validation ──────────────────────────────────────
        # In prevent mode: block requests that didn't come through Caddy.
        # In detect mode: log them but allow through (for debugging).
        set $bypass_detected 0;
        if ($edge_token_valid = 0) {
            set $bypass_detected 1;
        }

        # ── open-appsec metrics endpoint ─────────────────────────────────────
        location /open-appsec-metrics {
            access_log off;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny all;
            return 200 '{"status":"metrics-endpoint"}';
            add_header Content-Type application/json;
        }

        # ── Auth endpoints — secondary rate limiting ─────────────────────────
        location ~ ^/api/(oauth|trpc/auth) {
            limit_req zone=auth burst=10 nodelay;

            # Log WAF bypass attempts
            if ($bypass_detected = 1) {
                access_log /var/log/nginx/waf-bypass.log main;
            }

            proxy_pass http://apisix_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            # Pass through Caddy-resolved identity headers
            proxy_set_header X-BIS-User-ID $http_x_bis_user_id;
            proxy_set_header X-BIS-User-Email $http_x_bis_user_email;
            proxy_set_header X-BIS-User-Roles $http_x_bis_user_roles;
            proxy_set_header X-BIS-Tenant-ID $http_x_bis_tenant_id;
            # WAF protection marker
            proxy_set_header X-BIS-WAF-Protected "open-appsec";
            # Trace propagation
            proxy_set_header X-BIS-Trace-ID $http_x_bis_trace_id;
            proxy_set_header X-BIS-Request-ID $http_x_bis_request_id;
        }

        # ── LEX public submission ─────────────────────────────────────────────
        location = /api/trpc/lex.submitIncident {
            limit_req zone=lex_submit burst=5 nodelay;

            proxy_pass http://apisix_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-BIS-WAF-Protected "open-appsec";
            proxy_set_header X-BIS-Trace-ID $http_x_bis_trace_id;
        }

        # ── All other traffic ─────────────────────────────────────────────────
        location / {
            limit_req zone=global burst=100 nodelay;

            # Log WAF bypass attempts
            if ($bypass_detected = 1) {
                access_log /var/log/nginx/waf-bypass.log main;
            }

            proxy_pass http://apisix_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            # Pass through Caddy-resolved identity headers
            proxy_set_header X-BIS-User-ID $http_x_bis_user_id;
            proxy_set_header X-BIS-User-Email $http_x_bis_user_email;
            proxy_set_header X-BIS-User-Roles $http_x_bis_user_roles;
            proxy_set_header X-BIS-Tenant-ID $http_x_bis_tenant_id;
            # WAF protection marker
            proxy_set_header X-BIS-WAF-Protected "open-appsec";
            # Trace propagation
            proxy_set_header X-BIS-Trace-ID $http_x_bis_trace_id;
            proxy_set_header X-BIS-Request-ID $http_x_bis_request_id;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }
    }

    # ─── Internal health check server (port 8090) ────────────────────────────
    # Used by Caddy and docker-compose health checks
    server {
        listen 8090;
        server_name _;
        access_log off;

        location /health {
            return 200 '{"status":"ok","service":"open-appsec-waf","port":8090}';
            add_header Content-Type application/json;
        }

        location /waf-bypass-log {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            # Serve bypass log for monitoring
            alias /var/log/nginx/waf-bypass.log;
        }
    }
}
