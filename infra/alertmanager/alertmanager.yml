global:
  resolve_timeout: 5m

route:
  receiver: bis-owner-webhook
  group_by: [alertname, service, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: bis-owner-webhook
      group_wait: 10s
      repeat_interval: 1h

receivers:
  - name: bis-owner-webhook
    webhook_configs:
      - url: http://bff:3000/api/webhooks/grafana-alert
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials: ${GRAFANA_WEBHOOK_SECRET}
