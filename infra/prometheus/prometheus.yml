# BIS production Prometheus configuration. Production Compose injects every
# ${...} value from a host-controlled environment file; unset alert-routing or
# protected-scrape credentials make compose configuration fail before startup.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: bis
    environment: ${BIS_ENV}

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["${BIS_ALERTMANAGER_TARGET}"]

rule_files:
  - /etc/prometheus/rules/bis-production-alerts.yaml

scrape_configs:
  - job_name: apisix
    static_configs:
      - targets: ["apisix:9091"]
        labels:
          service: apisix
          layer: gateway
    metrics_path: /apisix/prometheus/metrics

  - job_name: bff-node
    static_configs:
      - targets: ["bff:3000"]
        labels:
          service: bff
          language: nodejs
          layer: application
    metrics_path: /api/metrics

  # Gateway metrics are deliberately protected by the same authenticated service
  # boundary as the control plane. Prometheus must receive its dedicated
  # least-privilege metrics key through the host-controlled environment file.
  - job_name: go-gateway-control-plane
    static_configs:
      - targets: ["gateway:8081"]
        labels:
          service: gateway
          language: go
          layer: application
    metrics_path: /internal/metrics
    authorization:
      type: Bearer
      credentials: "${BIS_PROMETHEUS_GATEWAY_KEY}"

  - job_name: python-risk-engine
    static_configs:
      - targets: ["risk-engine:8082"]
        labels:
          service: risk-engine
          language: python
          layer: application
    metrics_path: /metrics

  - job_name: rust-event-processor
    static_configs:
      - targets: ["event-processor:8083"]
        labels:
          service: event-processor
          language: rust
          layer: application
    metrics_path: /metrics

  - job_name: permify
    static_configs:
      - targets: ["permify:3476"]
        labels:
          service: permify
          layer: middleware
    metrics_path: /metrics

  - job_name: kafka
    static_configs:
      - targets: ["kafka:9092"]
        labels:
          service: kafka
          layer: middleware
    metrics_path: /metrics

  # The scheduled archive worker has no long-running HTTP listener. It pushes
  # its short-lived run metrics to a pre-provisioned HTTPS Pushgateway that this
  # job scrapes. The worker rejects non-HTTPS endpoints in production.
  - job_name: cold-archive-pushgateway
    scheme: https
    static_configs:
      - targets: ["${BIS_ARCHIVE_PUSHGATEWAY_TARGET}"]
        labels:
          service: cold-archive-writer
          layer: archival
    metrics_path: /metrics

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus
          layer: observability
