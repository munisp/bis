apiVersion: v1
kind: ServiceAccount
metadata:
  name: bis-bff
  namespace: bis-production
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bis-gateway
  namespace: bis-production
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bis-worker
  namespace: bis-production
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bis-migration
  namespace: bis-production
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bis-observability
  namespace: bis-production
automountServiceAccountToken: false
---
# The migration job may read exactly one release ConfigMap. It cannot list secrets,
# pods, deployments, or mutate Kubernetes resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bis-migration-release-reader
  namespace: bis-production
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["bis-release-metadata"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bis-migration-release-reader
  namespace: bis-production
subjects:
  - kind: ServiceAccount
    name: bis-migration
    namespace: bis-production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bis-migration-release-reader
---
# Deny all pod ingress/egress until explicit workload-specific policies are added.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bis-default-deny
  namespace: bis-production
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# Prometheus may scrape only the protected BFF and gateway metrics ports. Namespace
# selectors must be updated to match the deployed observability namespace labels.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bis-allow-observability-scrape
  namespace: bis-production
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: ["bff", "gateway"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 8081
