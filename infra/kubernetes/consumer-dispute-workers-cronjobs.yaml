---
# The release controller must replace all values through the deployment secret
# manager. The workers intentionally fail before network I/O if a required key
# policy, provider authorization, or provider contract is absent.
apiVersion: v1
kind: Secret
metadata:
  name: bis-consumer-dispute-worker
  labels:
    app.kubernetes.io/name: bis-consumer-dispute-worker
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_WITH_POSTGRESQL_URL"
  AUDIT_HMAC_SECRET: "REPLACE_WITH_ACTIVE_AUDIT_HMAC_KEY"
  BIS_CONSUMER_DISPUTE_OUTBOX_ACTIVE_KEY_VERSION: "REPLACE_WITH_ACTIVE_KEY_VERSION"
  BIS_CONSUMER_DISPUTE_OUTBOX_KEYRING: "REPLACE_WITH_VERSIONED_32_BYTE_BASE64_KEYRING"
  BIS_CONSUMER_DISPUTE_OUTBOX_KEY_EXPIRIES_JSON: "REPLACE_WITH_KEY_EXPIRY_REGISTRY_JSON"
  BIS_CONSUMER_DISPUTE_OUTBOX_ENFORCE_KEY_EXPIRY: "true"
  BIS_DEPLOYMENT_ENV: "production"
  BIS_ENV: "production"
