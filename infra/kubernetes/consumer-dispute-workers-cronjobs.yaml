apiVersion: batch/v1
kind: CronJob
metadata:
  name: bis-consumer-dispute-deadlines
  labels:
    app.kubernetes.io/name: bis-consumer-dispute-deadlines
    app.kubernetes.io/component: consumer-rights
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 10
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: bis-consumer-dispute-deadlines
        spec:
          restartPolicy: OnFailure
          serviceAccountName: bis-consumer-dispute-worker
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: deadline-worker
              image: registry.example.invalid/bis/bff@sha256:REPLACE_AT_RELEASE
              imagePullPolicy: IfNotPresent
              command: ["pnpm", "consumer-disputes:deadlines"]
              envFrom:
                - secretRef:
                    name: bis-consumer-dispute-worker
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: temporary
                  mountPath: /tmp
          volumes:
            - name: temporary
              emptyDir:
                sizeLimit: 64Mi
---
