apiVersion: batch/v1
kind: CronJob
metadata:
  name: bis-paystack-webhook-reconciliation
  labels:
    app.kubernetes.io/name: bis-paystack-webhook-reconciliation
    app.kubernetes.io/component: billing
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 90
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 10
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 180
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: bis-paystack-webhook-reconciliation
        spec:
          restartPolicy: OnFailure
          serviceAccountName: bis-billing-reconciliation
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconciliation-worker
              image: registry.example.invalid/bis/bff@sha256:REPLACE_AT_RELEASE
              imagePullPolicy: IfNotPresent
              command: ["pnpm", "billing:paystack-reconcile"]
              envFrom:
                - secretRef:
                    name: bis-billing-reconciliation
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: temporary
                  mountPath: /tmp
          volumes:
            - name: temporary
              emptyDir:
                sizeLimit: 64Mi
---
# The release controller must populate this Secret through its secret manager.
# The worker intentionally fails closed when the database, Paystack credential, or
# TigerBeetle settlement endpoint is absent; no mutable default is supplied here.
apiVersion: v1
kind: Secret
metadata:
  name: bis-billing-reconciliation
  labels:
    app.kubernetes.io/name: bis-billing-reconciliation
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_WITH_POSTGRESQL_URL"
  PAYSTACK_SECRET_KEY: "REPLACE_WITH_PAYSTACK_SERVER_SECRET"
  PAYSTACK_WEBHOOK_SECRET: "REPLACE_WITH_PAYSTACK_WEBHOOK_SECRET"
  TIGERBEETLE_URL: "REPLACE_WITH_INTERNAL_TIGERBEETLE_URL"
  BIS_DEPLOYMENT_ENV: "production"
  BIS_ENV: "production"
  BIS_PAYSTACK_WEBHOOK_WORKER_BATCH_SIZE: "50"
