# BIS Dapr Subscriptions
# This file defines the pub/sub subscriptions for the BIS BFF.
# The extended subscriptions are in subscriptions_extended.yaml
apiVersion: dapr.io/v1alpha1
kind: Subscription
metadata:
  name: bis-investigation-sub
spec:
  pubsubname: bis-pubsub
  topic: bis.investigation.events
  route: /api/dapr/investigation-events
