# Dependabot Configuration — BIS Platform
# =========================================
# Automatically creates PRs for security patches and version updates
# across all dependency ecosystems in the repository.

version: 2
updates:
  # ─── Node.js (pnpm) — Root BFF + Frontend ─────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Lagos"
    open-pull-requests-limit: 10
    reviewers:
      - "munisp"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "deps(npm):"
    groups:
      production-deps:
        patterns:
          - "*"
        exclude-patterns:
          - "@types/*"
          - "vitest"
          - "typescript"
        update-types:
          - "patch"
          - "minor"
      dev-deps:
        patterns:
          - "@types/*"
          - "vitest"
          - "typescript"
          - "esbuild"
          - "prettier"
        update-types:
          - "patch"
          - "minor"

  # ─── Rust — Event Processor ────────────────────────────────────────────────────
  - package-ecosystem: "cargo"
    directory: "/services/event-processor"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
      timezone: "Africa/Lagos"
    open-pull-requests-limit: 5
    reviewers:
      - "munisp"
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "deps(rust/event-processor):"

